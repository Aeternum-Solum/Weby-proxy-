<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Seguro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --error-bg: #7f1d1d;
            --error-text: #fca5a5;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-top: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loader-container {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            margin-top: 20px;
            display: none;
        }

        .error-box {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            border: 1px solid #991b1b;
            word-break: break-word;
        }

        .success-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8125rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Web Proxy</h1>
        <p class="subtitle">Acesse destinos autorizados com segurança</p>

        <div class="form-group">
            <label for="targetUrl">Endereço de Destino (URL)</label>
            <input type="url" id="targetUrl" placeholder="https://httpbin.org/get" required>
        </div>

        <button id="submitBtn" onclick="executeProxy()">Requisição</button>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">Processando requisição...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <label>Resultado / Resposta:</label>
            <div id="resultOutput"></div>
        </div>
    </div>

    <script>
        async function executeProxy() {
            const urlInput = document.getElementById('targetUrl');
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const resultOutput = document.getElementById('resultOutput');

            const targetUrl = urlInput.value.trim();
            if (!targetUrl) {
                alert('Por favor, insira um endereço válido.');
                return;
            }

            // Limpa estados anteriores e ativa carregamento
            resultContainer.style.display = 'none';
            resultOutput.innerHTML = '';
            loader.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: targetUrl })
                });

                const contentType = response.headers.get("content-type");
                let dataText = "";

                if (contentType && contentType.includes("application/json")) {
                    const jsonData = await response.json();
                    dataText = JSON.stringify(jsonData, null, 2);
                } else {
                    dataText = await response.text();
                }

                resultContainer.style.display = 'block';

                if (!response.ok) {
                    resultOutput.className = 'error-box';
                    resultOutput.textContent = `Erro HTTP ${response.status}: ${dataText}`;
                } else {
                    resultOutput.className = 'success-box';
                    resultOutput.textContent = dataText;
                }

            } catch (error) {
                resultContainer.style.display = 'block';
                resultOutput.className = 'error-box';
                resultOutput.textContent = `Falha de rede ou erro inesperado: ${error.message}`;
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
  </html>
